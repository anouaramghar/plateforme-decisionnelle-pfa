server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache immutable build assets (Vite emits hashed filenames).
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: unknown paths serve index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # NOTE: security headers (X-Content-Type-Options, X-Frame-Options,
    # Referrer-Policy, X-XSS-Protection) are added by the OUTER nginx
    # (nginx/nginx.conf) which proxies all traffic through this container.
    # They are intentionally NOT repeated here — duplicating add_header would
    # emit two copies of each header to the client. Cache-Control is kept
    # because the outer nginx does not set it for static SPA assets.
}
