worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # Timeouts generous enough for ML predictions that may take a few seconds.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Compression for API/JSON and frontend assets.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml
                      application/json application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Basic rate limit for the API surface.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Log with real client IP (we set X-Forwarded-For below).
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Security headers (applied to all locations).
        add_header X-Content-Type-Options "nosniff"            always;
        add_header X-Frame-Options        "DENY"               always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection       "1; mode=block"      always;

        # Reasonable upload cap — raise deliberately if exports or imports need more.
        client_max_body_size 10m;

        # ── API → ASP.NET backend ────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=40 nodelay;

            proxy_pass         http://backend:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
        }

        # ── Frontend SPA ─────────────────────────────────────
        location / {
            proxy_pass         http://frontend:8080/;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
        }
    }
}
