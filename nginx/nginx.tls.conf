# TLS-enabled nginx config (production). Selected by 05-tls-select.sh
# when ENABLE_TLS=true. Port 80 is reduced to a 301 redirect to HTTPS;
# all traffic is served on 443 with HSTS + modern TLS settings.
#
# Cert paths are fixed (/etc/nginx/certs/fullchain.pem + privkey.pem) so
# nginx needs no envsubst templating (which would risk clobbering nginx's
# own $host variables). Bind-mount your certs at those names — see
# nginx/generate-dev-certs.sh for a self-signed dev cert, or use Let's
# Encrypt / your CA cert in production.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml
                      application/json application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    # 30r/m with burst 10 — tolerant of a small office behind NAT while still
    # blunting credential stuffing. Backend also enforces a .NET "login" limiter.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # ── HTTP → HTTPS redirect ─────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS ─────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2  on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS — once a browser has seen this, it will refuse plain HTTP for a
        # year. Only emit over HTTPS (it's a no-op / ignored on HTTP anyway).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff"                              always;
        add_header X-Frame-Options           "DENY"                                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
        add_header X-XSS-Protection          "1; mode=block"                        always;

        client_max_body_size 10m;

        include /etc/nginx/locations.conf;
    }
}
