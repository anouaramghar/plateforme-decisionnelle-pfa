# HTTP-only nginx config (dev / no-TLS mode). Selected by 05-tls-select.sh
# when ENABLE_TLS is unset or "false". Behaviour is identical to the
# pre-TLS single-config setup.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile          on;
    tcp_nopush        on;
    keepalive_timeout 65;

    # Timeouts generous enough for ML predictions that may take a few seconds.
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # Compression for API/JSON and frontend assets.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml
                      application/json application/javascript application/xml+rss
                      application/atom+xml image/svg+xml;

    # Basic rate limit for the API surface.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # Stricter limit for the login endpoint to blunt credential stuffing /
    # brute force. 30 attempts/min/IP with burst 10 — tight enough to stop
    # automated stuffing (well under bot throughput) but tolerant of a small
    # office behind shared NAT, where the previous 10r/m would lock colleagues
    # out after a handful of honest typos. The backend also enforces its own
    # .NET RateLimiter "login" policy (5/60s) as defence-in-depth.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;

    # HSTS — empty on HTTP (this config only listens on :80), set on HTTPS.
    # The map keeps the header absent in HTTP-only mode so browsers are never
    # pinned to a scheme the deployment doesn't serve; if you flip ENABLE_TLS,
    # nginx.tls.conf carries the real max-age header instead.
    map $scheme $strict_transport_security {
        https "max-age=31536000; includeSubDomains";
        default "";
    }

    # Log with real client IP (we set X-Forwarded-For below).
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'xff="$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    server {
        listen 80;
        server_name _;

        # Security headers (applied to all locations).
        add_header X-Content-Type-Options "nosniff"            always;
        add_header X-Frame-Options        "DENY"               always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection       "1; mode=block"      always;
        # HSTS — empty on HTTP (see map above). `always` so it applies to
        # error responses too once TLS is enabled.
        add_header Strict-Transport-Security $strict_transport_security always;

        # Reasonable upload cap — raise deliberately if exports or imports need more.
        client_max_body_size 10m;

        include /etc/nginx/locations.conf;
    }
}
