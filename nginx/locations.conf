# Shared location blocks — included by both nginx.http.conf and nginx.tls.conf
# so the proxy rules stay in lock-step between dev (HTTP) and prod (HTTPS).

# ── Login → stricter rate limit ──────────────────────
# Regex location so it wins over the /api/ prefix and matches the
# case-insensitive ASP.NET route (/api/auth/login, /api/Auth/login).
location ~* ^/api/auth/login {
    limit_req zone=auth_limit burst=10 nodelay;

    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Connection          "";
    proxy_set_header   Host                $host;
    proxy_set_header   X-Real-IP           $remote_addr;
    proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto   $scheme;
    proxy_set_header   X-Forwarded-Host    $host;
}

# ── CopilotKit runtime (SSE streaming) ───────────────
# Longest-prefix match wins, so /api/copilotkit is served here and NOT
# by /api/ below. The backend's /api/copilot/* routes (chat/confirm/tool)
# are unaffected because "copilot/" does not start with "copilotkit".
location /api/copilotkit {
    proxy_pass         http://copilot-runtime:4000;
    proxy_http_version 1.1;
    proxy_set_header   Connection          "";
    proxy_set_header   Host                $host;
    proxy_set_header   X-Real-IP           $remote_addr;
    proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto   $scheme;
    proxy_set_header   X-Forwarded-Host    $host;
    # Streaming responses: flush tokens to the browser as they arrive.
    proxy_buffering    off;
    proxy_cache        off;
}

# ── API → ASP.NET backend ────────────────────────────
location /api/ {
    limit_req zone=api_limit burst=40 nodelay;

    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Connection          "";
    proxy_set_header   Host                $host;
    proxy_set_header   X-Real-IP           $remote_addr;
    proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto   $scheme;
    proxy_set_header   X-Forwarded-Host    $host;
}

# ── Frontend SPA ─────────────────────────────────────
location / {
    proxy_pass         http://frontend:8080/;
    proxy_http_version 1.1;
    proxy_set_header   Connection          "";
    proxy_set_header   Host                $host;
    proxy_set_header   X-Real-IP           $remote_addr;
    proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto   $scheme;
    proxy_set_header   X-Forwarded-Host    $host;
}
