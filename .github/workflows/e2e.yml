name: e2e

# End-to-end smoke tests against the full docker-compose stack.
# Not run on every PR (SQL Server cold boot + ML training make it too slow and
# flaky for the per-PR gate) — runs nightly and on manual dispatch instead.
# The unit/integration CI (.github/workflows/ci.yml) still gates every PR.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # nightly 03:00 UTC

jobs:
  playwright:
    name: Playwright smoke (docker compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Must match the admin seeded by DataSeeder (written to .env below).
      E2E_BASE_URL: http://localhost:80
      E2E_ADMIN_EMAIL: admin@eniad.ma
      E2E_ADMIN_PASSWORD: E2eTestAdmin@2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Write .env for the stack
        run: |
          cp .env.example .env
          # Override every CHANGE_ME secret with a strong, distinct test value.
          sed -i 's|^SA_PASSWORD=.*|SA_PASSWORD=E2eTest-SqlServer-2026-StrongPwd!|' .env
          sed -i 's|^APP_DB_PASSWORD=.*|APP_DB_PASSWORD=E2eTest-AppDb-2026-DifferentPwd!|' .env
          sed -i 's|^READONLY_DB_PASSWORD=.*|READONLY_DB_PASSWORD=E2eTest-ReadOnly-2026-Pwd!|' .env
          sed -i 's|^JWT_SECRET=.*|JWT_SECRET=e2e-test-jwt-secret-with-at-least-32-characters-of-entropy-2026|' .env
          sed -i 's|^ML_INTERNAL_TOKEN=.*|ML_INTERNAL_TOKEN=e2e-test-ml-internal-token-0123456789abcdef|' .env
          sed -i 's|^AGENT_INTERNAL_TOKEN=.*|AGENT_INTERNAL_TOKEN=e2e-test-agent-internal-token-0123456789ab|' .env
          sed -i 's|^ADMIN_SEED_EMAIL=.*|ADMIN_SEED_EMAIL=admin@eniad.ma|' .env
          sed -i 's|^ADMIN_SEED_PASSWORD=.*|ADMIN_SEED_PASSWORD=E2eTestAdmin@2026|' .env
          sed -i 's|^NVIDIA_NIM_API_KEY=.*|NVIDIA_NIM_API_KEY=nvapi-disabled-for-e2e|' .env
          sed -i 's|^ASPNETCORE_ENVIRONMENT=.*|ASPNETCORE_ENVIRONMENT=Production|' .env

      - name: Build & start the stack
        run: docker compose up -d --build --wait

      - name: Install frontend deps + Playwright browser
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/

      - name: Dump service logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --tail=200 backend || true
          docker compose logs --tail=200 nginx || true
          docker compose logs --tail=200 frontend || true

      - name: Tear down
        if: always()
        run: docker compose down -v
