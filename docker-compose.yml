services:
  # 1. Base de données SQL Server
  db:
    build:
      context: ./database
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      # Distinct credential for the Copilot read-only DW login (pfa_app_readonly).
      # Kept separate from APP_DB_PASSWORD so a leak of one does not expose both.
      - READONLY_DB_PASSWORD=${READONLY_DB_PASSWORD}
    # Bound to localhost only — dev convenience for SSMS / Azure Data Studio.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=$${SA_PASSWORD} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -d PFA_DB -C -b -Q \"IF NOT EXISTS (SELECT 1 FROM dbo.SchemaState WHERE Component='core' AND Version >= 1) THROW 51000, 'schema not ready', 1\""]
      interval: 15s
      timeout: 10s
      retries: 10
      # Cold first boot of mssql/server:2022-latest sits in "script upgrade mode"
      # for several minutes when the volume already has system DBs from a prior
      # image. start_period must exceed that, otherwise Docker counts failed
      # probes as real failures and backend/ml-service give up on the depends_on.
      start_period: 300s
    restart: unless-stopped
    networks:
      - pfa_internal_db
      # Dedicated NON-internal bridge so SQL Server's published port
      # (127.0.0.1:1433) is actually reachable from the host for SSMS /
      # Azure Data Studio. A container attached ONLY to internal networks
      # cannot publish host ports — Docker silently drops the binding.
      # This network has no other members, so frontend/nginx still cannot
      # reach the DB; only backend (on pfa_internal_db) and the host can.
      - pfa_db_host

  # 1b. DB backup sidecar — periodic full backups of PFA_DB + PFA_DW with
  # retention pruning. Shares the mssql/server image (for its bundled sqlcmd)
  # but does NOT run sqlservr: entrypoint is cleared and a backup loop runs
  # instead. Backups land on the db_backups named volume so they survive
  # sidecar restarts. Back that volume up OFF-HOST (S3 / NAS / tape) for real
  # disaster recovery — a backup on the same host as the DB is not DR.
  db-backup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    entrypoint: [""]
    command:
      - /bin/bash
      - -c
      - |
        echo "db-backup starting: interval=$${BACKUP_INTERVAL_SECONDS}s retention=$${BACKUP_RETENTION_DAYS}d"
        # Run one backup immediately so a fresh deploy has a baseline, then loop.
        /backup.sh || true
        while true; do
          sleep "$${BACKUP_INTERVAL_SECONDS}"
          /backup.sh || true
        done
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - DB_HOST=db
      - BACKUP_DIR=/backups
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_INTERVAL_SECONDS=${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./database/backup.sh:/backup.sh:ro
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      # Only needs to reach `db` on the DB plane — never internet-facing.
      - pfa_internal_db

  # 2. Backend ASP.NET Core 8
  backend:
    build:
      context: ./backend
    # Expose backend directly so Swagger UI is reachable at http://localhost:5135/swagger
    # during development. Remove this ports block before production deployment.
    ports:
      - "127.0.0.1:5135:8080"
    environment:
      # Backend connects as least-privilege pfa_app — NOT as sa.
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME};User=pfa_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;
      - ML_API_URL=${ML_API_URL}
      - ML_INTERNAL_TOKEN=${ML_INTERNAL_TOKEN}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN}
      - COPILOT_DW_READONLY_CONN=Server=db;Database=PFA_DW;User Id=pfa_app_readonly;Password=${READONLY_DB_PASSWORD};TrustServerCertificate=True;
      - ASPNETCORE_URLS=http://+:8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
      - ADMIN_SEED_NOM=${ADMIN_SEED_NOM:-Admin}
      - ADMIN_SEED_PRENOM=${ADMIN_SEED_PRENOM:-ENIAD}
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        # service_started, NOT service_healthy: predictions degrade gracefully
        # (PredictionsController records MlUnavailable and the BI platform stays
        # up), so an unhealthy/slow ML model must NOT block the whole backend —
        # and therefore nginx — from booting.
        condition: service_started
      # NOTE: copilot-runtime is intentionally NOT a startup gate. Copilot is an
      # optional add-on; the BI platform (auth, students, notes, exports) must
      # boot and stay available even if the AI sidecar is down or unhealthy.
      # The frontend surfaces a clean error when it can't reach copilot-runtime,
      # so no hard dependency is needed here.
    healthcheck:
      # curl is installed in the backend Dockerfile runtime stage.
      # Probe /ready (DB reachable + schema marker), NOT /health (liveness
      # only) — otherwise the backend reports healthy and nginx admits traffic
      # before the schema is provisioned, or after a migration silently failed.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      - pfa_public
      - pfa_internal_db
      - pfa_internal_ml

  # 3. Microservice IA (Python 3.11 / FastAPI)
  ml-service:
    build:
      context: ./ml_service
    environment:
      - ML_INTERNAL_TOKEN=${ML_INTERNAL_TOKEN}
      - MODEL_DIR=/app/saved_models
      # Read-only DW access: the ML service only LOADS training data from PFA_DW,
      # it never writes. Using the dedicated pfa_app_readonly login (db_datareader
      # on PFA_DW only, no PFA_DB access) instead of pfa_app drops the ML service
      # to true least-privilege — a compromise of the ML container cannot mutate
      # the warehouse or reach OLTP data.
      - DW_CONNECTION_STRING=DRIVER={ODBC Driver 18 for SQL Server};SERVER=db;DATABASE=PFA_DW;UID=pfa_app_readonly;PWD=${READONLY_DB_PASSWORD};TrustServerCertificate=yes;
      # MLflow tracking URI — when set, every training run logs params/metrics/
      # artifacts to the mlflow service. Best-effort: training proceeds with
      # joblib-on-disk if mlflow is down or this is empty.
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      - MLFLOW_EXPERIMENT_NAME=${MLFLOW_EXPERIMENT_NAME:-pfa_student_risk}
    volumes:
      # Persist trained .joblib models across container restarts and re-deploys.
      # Without this, every restart forces a full retrain from DW data (or falls
      # back to synthetic data if DW is empty).
      - ml_models_data:/app/saved_models
    # Gate startup on the DB being ready: without this, first boot races the DB
    # healthcheck, load_risk_data() silently falls back to synthetic data, and
    # the model is then frozen at synthetic until a manual retrain.
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pfa_internal_ml
      - pfa_internal_db

  # 3b. MLflow tracking server — model lineage for the ML service.
  # Every training run (startup auto-train + /predict/retrain) logs params,
  # metrics, tags, and the .joblib artifact here when MLFLOW_TRACKING_URI is
  # set on ml-service. The UI is reachable from the host at 127.0.0.1:5001 for
  # the soutenance demo; it is NOT proxied by nginx (internal only) so it is
  # never internet-facing. ml-service is intentionally NOT gated on this
  # service: training degrades gracefully to joblib-on-disk if MLflow is down.
  mlflow:
    build:
      context: ./mlflow
    volumes:
      - mlflow_data:/mlflow
    ports:
      # Host-only UI access for the demo — bound to 127.0.0.1 so it is not
      # reachable from the LAN/internet. Remove in hardened deployments.
      - "127.0.0.1:5001:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      # ml-service reaches mlflow on the internal ML plane.
      - pfa_internal_ml
      # Non-internal bridge whose sole member is mlflow, so the published
      # 127.0.0.1:5001 host port works (a container on only internal networks
      # cannot publish host ports). Mirrors the pfa_db_host pattern for the DB.
      - pfa_mlflow_host

  # 6. CopilotKit runtime (Node 20 / Express + @copilotkit/runtime v2)
  # Serves the CopilotKit sidebar's runtime endpoint. nginx proxies
  # /api/copilotkit here; the frontend's <CopilotKit> provider talks to it.
  # Optional add-on — like agent-service, it is NOT a startup gate for nginx,
  # so the BI platform stays up even if this sidecar is down.
  copilot-runtime:
    build:
      context: ./copilot-runtime
    environment:
      - PORT=4000
      # Must match the backend's JWT_SECRET — the runtime verifies the JWT
      # signature before forwarding tool calls to the backend.
      - JWT_SECRET=${JWT_SECRET}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - NVIDIA_NIM_BASE_URL=${NVIDIA_NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - COPILOT_MODEL_ROUTER=${COPILOT_MODEL_ROUTER:-meta/llama-3.3-70b-instruct}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN}
      # Internal service URL — hardcoded (NOT ${BACKEND_URL}) so a local-dev
      # BACKEND_URL=http://localhost:5135 in .env can't leak into the container.
      - BACKEND_URL=http://backend:8080
      # Same-origin in the nginx-proxied setup, so CORS is moot; set anyway.
      - FRONTEND_URL=${COPILOT_RUNTIME_FRONTEND_URL:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      # pfa_public: reachable by nginx, reaches backend (also on pfa_public),
      # and gets outbound internet for the NVIDIA NIM API.
      - pfa_public

  # 4. Frontend React.js (nginx-unprivileged serves on 8080)
  frontend:
    build:
      context: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pfa_public

  # 5. Reverse Proxy Nginx
  nginx:
    # Built from ./nginx — the image bakes in an HTTP-only and a TLS config
    # and picks one at startup via 05-tls-select.sh based on ENABLE_TLS. This
    # avoids envsubst templating (which would risk clobbering nginx's own
    # $host variables) and keeps dev mode byte-identical to the pre-TLS setup.
    build:
      context: ./nginx
    ports:
      # HTTP — serves traffic when ENABLE_TLS=false, or 301-redirects to
      # HTTPS when ENABLE_TLS=true.
      - "80:80"
      # HTTPS — only listened on when ENABLE_TLS=true. Publishing 443 on the
      # host unconditionally is harmless: in HTTP-only mode nginx doesn't bind
      # 443 so connections are simply refused, and flipping ENABLE_TLS needs
      # no compose change.
      - "443:443"
    environment:
      - ENABLE_TLS=${ENABLE_TLS:-false}
    volumes:
      # Certs, read-only. Required only when ENABLE_TLS=true, but always
      # mounted — in HTTP-only mode the directory may be empty. Put your
      # fullchain.pem + privkey.pem here (see nginx/generate-dev-certs.sh for
      # a self-signed dev cert, or use Let's Encrypt / your CA for production).
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    # Healthcheck: nginx:alpine ships wget, so probe the index page. Catches
    # config-reload failures (nginx -t can pass but runtime can still 500 on
    # a bad upstream block) and container-level issues without waiting for an
    # external client to notice a black page.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - pfa_public

networks:
  # ─── Five isolated Docker networks ─────────────────────────────
  # pfa_public:        internet-facing. nginx + frontend + backend + copilot-runtime.
  # pfa_internal_db:   DB plane, internal=true (no internet). backend ↔ db ↔ ml-service.
  # pfa_internal_ml:   ML plane, internal=true (no internet). backend ↔ ml-service ↔ mlflow.
  # pfa_db_host:       NON-internal bridge whose SOLE member is `db`, so the
  #                    published 127.0.0.1:1433 port is reachable from the host for
  #                    SSMS / Azure Data Studio. A container attached only to
  #                    internal networks cannot publish host ports (Docker silently
  #                    drops the binding), so this fourth network exists purely to
  #                    make the host port binding work without exposing the DB to
  #                    any other service. frontend/nginx are NOT on it.
  # pfa_mlflow_host:   NON-internal bridge whose sole member is mlflow, so the
  #                    published 127.0.0.1:5001 port works for the demo UI.
  pfa_public:
    driver: bridge
  # DB plane: only backend ↔ db ↔ ml-service. No external access.
  pfa_internal_db:
    driver: bridge
    internal: true
  # Host-access plane for the DB only — NOT internal, so the published
  # 127.0.0.1:1433 port works for SSMS. db is its sole member.
  pfa_db_host:
    driver: bridge
  # ML plane: only backend ↔ ml-service ↔ mlflow.
  pfa_internal_ml:
    driver: bridge
    internal: true
  # Host-access plane for MLflow only — NOT internal, so the published
  # 127.0.0.1:5001 port works for the demo UI. mlflow is its sole member.
  pfa_mlflow_host:
    driver: bridge

volumes:
  sqlserver_data:
  ml_models_data:   # persists ML .joblib files across ml-service restarts
  db_backups:       # SQL Server .bak files written by the db-backup sidecar
  mlflow_data:      # MLflow SQLite store + artifact root (runs, params, metrics)
