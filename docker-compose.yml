services:
  # 1. Base de données SQL Server
  db:
    build:
      context: ./database
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD}
      # Distinct credential for the Copilot read-only DW login (pfa_app_readonly).
      # Kept separate from APP_DB_PASSWORD so a leak of one does not expose both.
      - READONLY_DB_PASSWORD=${READONLY_DB_PASSWORD}
    # Bound to localhost only — dev convenience for SSMS / Azure Data Studio.
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=${SA_PASSWORD} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -Q 'SELECT 1' -C"]
      interval: 15s
      timeout: 10s
      retries: 10
      # Cold first boot of mssql/server:2022-latest sits in "script upgrade mode"
      # for several minutes when the volume already has system DBs from a prior
      # image. start_period must exceed that, otherwise Docker counts failed
      # probes as real failures and backend/ml-service give up on the depends_on.
      start_period: 300s
    restart: unless-stopped
    networks:
      - pfa_internal_db
      # pfa_public intentionally omitted: Docker host-port binding (127.0.0.1:1433)
      # works at the host level and does NOT require a shared Docker network.
      # Keeping db off pfa_public means nginx and frontend cannot reach SQL Server.

  # 2. Backend ASP.NET Core 8
  backend:
    build:
      context: ./backend
    # Expose backend directly so Swagger UI is reachable at http://localhost:5135/swagger
    # during development. Remove this ports block before production deployment.
    ports:
      - "127.0.0.1:5135:8080"
    environment:
      # Backend connects as least-privilege pfa_app — NOT as sa.
      - ConnectionStrings__DefaultConnection=Server=db;Database=${DB_NAME};User=pfa_app;Password=${APP_DB_PASSWORD};TrustServerCertificate=True;
      - ML_API_URL=${ML_API_URL}
      - ML_INTERNAL_TOKEN=${ML_INTERNAL_TOKEN}
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN}
      - AGENT_SERVICE_URL=${AGENT_SERVICE_URL:-http://agent-service:8001}
      - ASPNETCORE_URLS=http://+:8080
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
      - ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
      - ADMIN_SEED_NOM=${ADMIN_SEED_NOM:-Admin}
      - ADMIN_SEED_PRENOM=${ADMIN_SEED_PRENOM:-ENIAD}
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      # NOTE: agent-service is intentionally NOT a startup gate. Copilot is an
      # optional add-on; the BI platform (auth, students, notes, exports) must
      # boot and stay available even if the AI sidecar is down or unhealthy.
      # CopilotController surfaces a clean SSE `error` event when it can't reach
      # agent-service, so no hard dependency is needed here.
    healthcheck:
      # curl is installed in the backend Dockerfile runtime stage.
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - pfa_public
      - pfa_internal_db
      - pfa_internal_ml

  # 3. Microservice IA (Python 3.11 / FastAPI)
  ml-service:
    build:
      context: ./ml_service
    environment:
      - ML_INTERNAL_TOKEN=${ML_INTERNAL_TOKEN}
      - MODEL_DIR=/app/saved_models
      - DW_CONNECTION_STRING=DRIVER={ODBC Driver 18 for SQL Server};SERVER=db;DATABASE=PFA_DW;UID=pfa_app;PWD=${APP_DB_PASSWORD};TrustServerCertificate=yes;
    volumes:
      # Persist trained .joblib models across container restarts and re-deploys.
      # Without this, every restart forces a full retrain from DW data (or falls
      # back to synthetic data if DW is empty).
      - ml_models_data:/app/saved_models
    # Gate startup on the DB being ready: without this, first boot races the DB
    # healthcheck, load_risk_data() silently falls back to synthetic data, and
    # the model is then frozen at synthetic until a manual retrain.
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pfa_internal_ml
      - pfa_internal_db

  # 6. Copilot agent-service (Python 3.11 / FastAPI)
  # Orchestrates the agentic AI loop against NVIDIA NIM. Reachable only from
  # the backend over pfa_internal_ml (no host port, no nginx route).
  agent-service:
    build:
      context: ./agent-service
    environment:
      - AGENT_INTERNAL_TOKEN=${AGENT_INTERNAL_TOKEN}
      - NVIDIA_NIM_API_KEY=${NVIDIA_NIM_API_KEY}
      - COPILOT_MODEL_ROUTER=${COPILOT_MODEL_ROUTER:-meta/llama-3.3-70b-instruct}
      - COPILOT_MODEL_SQL=${COPILOT_MODEL_SQL:-minimaxai/minimax-m2.7}
      - COPILOT_MODEL_REASON=${COPILOT_MODEL_REASON:-nvidia/llama-3.3-nemotron-super-49b-v1.5}
      - COPILOT_MODEL_SAFETY=${COPILOT_MODEL_SAFETY:-nvidia/llama-3.1-nemotron-safety-guard-8b-v3}
      - COPILOT_EMBED_MODEL=${COPILOT_EMBED_MODEL:-nvidia/nv-embedqa-e5-v5}
      - COPILOT_MAX_TOOL_ITERATIONS=${COPILOT_MAX_TOOL_ITERATIONS:-8}
      - COPILOT_TURN_TOKEN_BUDGET_IN=${COPILOT_TURN_TOKEN_BUDGET_IN:-20000}
      - COPILOT_TURN_TOKEN_BUDGET_OUT=${COPILOT_TURN_TOKEN_BUDGET_OUT:-4000}
      - COPILOT_DAILY_TOKEN_CAP_PER_USER=${COPILOT_DAILY_TOKEN_CAP_PER_USER:-200000}
      # Read-only DW connection for the P1.B query_dw tool. Passed now so the
      # env contract is stable; consumed once query_dw lands.
      - COPILOT_DW_READONLY_CONN=${COPILOT_DW_READONLY_CONN:-}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      # pfa_internal_ml: reachable from backend (the only thing that calls us).
      - pfa_internal_ml
      # pfa_public: required for outbound internet (NIM API). pfa_internal_ml
      # is internal:true which blocks egress. No host port + no nginx route is
      # added, so this does NOT expose agent-service externally.
      - pfa_public

  # 4. Frontend React.js (nginx-unprivileged serves on 8080)
  frontend:
    build:
      context: ./frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--timeout=3", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - pfa_public

  # 5. Reverse Proxy Nginx
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pfa_public

networks:
  # Public-facing traffic: only nginx, frontend, backend.
  pfa_public:
    driver: bridge
  # DB plane: only backend ↔ db. No external access, no ML reach.
  pfa_internal_db:
    driver: bridge
    internal: true
  # ML plane: only backend ↔ ml-service.
  pfa_internal_ml:
    driver: bridge
    internal: true

volumes:
  sqlserver_data:
  ml_models_data:   # persists ML .joblib files across ml-service restarts
